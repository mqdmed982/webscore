<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Domain Intelligence Scanner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css">

    <style>
        body { background-color: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .header-title { color: #007bff; font-weight: 500; font-size: 1.4rem; display: flex; align-items: center; gap: 8px; }
        .card-header-blue { background-color: #007bff; color: #fff; font-weight: 500; padding: 0.6rem 1rem; border-radius: 4px 4px 0 0; }
        .table-custom th { background-color: #f8f9fa; font-size: 0.85rem; font-weight: 600; }
        .table-custom td { font-size: 0.85rem; vertical-align: middle; }
        .col-filter { width: 100%; border: 1px solid #ced4da; border-radius: 3px; font-size: 0.8rem; padding: 2px 6px; color: #6c757d; }
        .btn-export { background-color: #f8f9fa; border: 1px solid #ced4da; color: #333; font-size: 0.8rem; padding: 3px 8px; }
    </style>
</head>
<body class="p-3">
    <div class="container-fluid">
        <div class="mb-3">
            <div class="header-title"><i class="bi bi-globe"></i> Domain Intelligence Scanner</div>
            <div class="text-muted small">Enter domains below to analyze their reputation, listing status, and behavior across various datasets.</div>
        </div>

        <!-- Input Box -->
        <div class="card mb-3 shadow-sm border">
            <div class="card-header bg-light py-2"><strong><i class="bi bi-table"></i> Domain Input</strong></div>
            <div class="card-body p-2">
                <textarea id="domainInput" class="form-control" rows="3" placeholder="awsglobalaccelerator.com&#10;google.com">google.com</textarea>
            </div>
        </div>

        <!-- Radio Buttons -->
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <div class="card h-100 p-3 shadow-sm border">
                    <h6 class="fw-bold mb-2">Basic Checks</h6>
                    <div class="form-check"><input class="form-check-input" type="radio" name="scanType" id="m_gen" value="general"> <label class="form-check-label" for="m_gen">General Overview</label></div>
                    <div class="form-check"><input class="form-check-input" type="radio" name="scanType" id="m_dim" value="reputation_dim"> <label class="form-check-label" for="m_dim">Reputation Dimensions</label></div>
                    <div class="form-check"><input class="form-check-input" type="radio" name="scanType" id="m_ctx" value="domain_context"> <label class="form-check-label" for="m_ctx">Domain Context</label></div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card h-100 p-3 shadow-sm border">
                    <h6 class="fw-bold mb-2">Reputation Insights</h6>
                    <div class="form-check"><input class="form-check-input" type="radio" name="scanType" id="m_bl" value="blacklist"> <label class="form-check-label" for="m_bl">Blacklist Listing</label></div>
                    <div class="form-check"><input class="form-check-input" type="radio" name="scanType" id="m_snd" value="domain_senders" checked> <label class="form-check-label" for="m_snd">Domain Senders</label></div>
                    <div class="form-check"><input class="form-check-input" type="radio" name="scanType" id="m_a" value="a_record"> <label class="form-check-label" for="m_a">A Record Reputation</label></div>
                    <div class="form-check"><input class="form-check-input" type="radio" name="scanType" id="m_ns" value="ns_rep"> <label class="form-check-label" for="m_ns">Nameserver Reputation</label></div>
                    <div class="form-check"><input class="form-check-input" type="radio" name="scanType" id="m_host" value="hostnames"> <label class="form-check-label" for="m_host">Hostnames Listed</label></div>
                </div>
            </div>
        </div>

        <div class="text-end mb-4">
            <button class="btn btn-primary px-4 shadow-sm" id="btnAnalyze" onclick="runAnalysis()">
                <i class="bi bi-search"></i> Analyze Domains
            </button>
        </div>

        <!-- Table Container -->
        <div class="card shadow-sm border">
            <div class="card-header-blue" id="tableHeaderLabel">Domain Senders</div>
            <div class="card-body p-3">
                <div class="table-responsive">
                    <table id="resultsTable" class="table table-bordered table-custom w-100">
                        <thead></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>

    <script>
        let dtInstance = null;

        async function runAnalysis() {
            const inputVal = document.getElementById('domainInput').value.trim();
            if (!inputVal) return alert("المرجو إدخال دومين.");

            const mode = document.querySelector('input[name="scanType"]:checked').value;
            const btn = document.getElementById('btnAnalyze');
            btn.innerHTML = `<span class="spinner-border spinner-border-sm"></span> Analyzing...`;
            btn.disabled = true;

            try {
                const response = await fetch('/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ domains: inputVal, mode: mode })
                });
                const res = await response.json();

                renderSendersTable(res.mode, res.data);
            } catch (err) {
                alert("وقع خطأ فـ الاتصال بالخادم.");
            } finally {
                btn.innerHTML = `<i class="bi bi-search"></i> Analyze Domains`;
                btn.disabled = false;
            }
        }

        function renderSendersTable(mode, data) {
            if (dtInstance) {
                dtInstance.destroy();
                $('#resultsTable').empty();
            }

            let title = "Domain Senders";
            let columns = [];

            if (mode === 'domain_senders') {
                title = "Domain Senders";
                columns = [
                    { title: "Domain", data: "domain" },
                    { title: "IP", data: "ip" },
                    { title: "HELO", data: "helo" },
                    { title: "Last Seen", data: "last_seen" },
                    { title: "Score", data: "score" }
                ];
            } else {
                title = "Domain - General";
                columns = [
                    { title: "Domain", data: "domain" },
                    { title: "Last Seen", data: "last_seen" },
                    { title: "Tags", data: "tags", render: d => `<code>${JSON.stringify(d)}</code>` },
                    { title: "Abused", data: "abused", render: d => d ? '<span class="text-danger">true</span>' : 'false' },
                    { title: "Whois", data: "whois", render: w => `<ul><li>created: ${w.created}</li><li>expires: ${w.expires}</li><li>registrar: ${w.registrar}</li></ul>` },
                    { title: "Score", data: "score" },
                    { title: "Clusters", data: "clusters" }
                ];
            }

            document.getElementById('tableHeaderLabel').innerText = title;

            // بناء الرؤوس والـ Inputs التحتية لكل عمود
            let theadHtml = '<tr>';
            columns.forEach(c => theadHtml += `<th>${c.title}</th>`);
            theadHtml += '</tr><tr class="filters">';
            columns.forEach(c => theadHtml += `<th><input type="text" class="col-filter" placeholder="${c.title}" /></th>`);
            theadHtml += '</tr>';

            $('#resultsTable').html(`<thead>${theadHtml}</thead><tbody></tbody>`);

            dtInstance = $('#resultsTable').DataTable({
                data: data,
                columns: columns,
                orderCellsTop: true,
                dom: '<"d-flex justify-content-between align-items-center mb-2"<"btn-group"B>f>rtip',
                buttons: [{ extend: 'csvHtml5', text: 'Export CSV', className: 'btn btn-export' }],
                initComplete: function () {
                    var api = this.api();
                    // تفعيل البحث لكل عمود
                    api.columns().eq(0).each(function (colIdx) {
                        $('input', $('.filters th')[colIdx]).on('keyup change', function () {
                            api.column(colIdx).search(this.value).draw();
                        });
                    });
                }
            });
        }

        $(document).ready(() => {
            runAnalysis();
        });
    </script>
</body>
</html>
