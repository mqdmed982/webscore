<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Domain Intelligence Scanner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .header-title { color: #007bff; font-weight: bold; }
        .card-header-blue { background-color: #007bff; color: white; font-weight: 500; }
    </style>
</head>
<body class="p-4">
    <div class="container-fluid">
        <!-- Header -->
        <div class="mb-4">
            <h3 class="header-title"><i class="bi bi-globe"></i> Domain Intelligence Scanner</h3>
            <p class="text-muted">Enter domains below to analyze their reputation, listing status, and behavior across various datasets.</p>
        </div>

        <!-- Input Box -->
        <div class="card mb-3">
            <div class="card-header bg-light"><strong><i class="bi bi-table"></i> Domain Input</strong></div>
            <div class="card-body">
                <textarea id="domainInput" class="form-control" rows="3" placeholder="lotterysambadresult.in&#10;google.com"></textarea>
            </div>
        </div>

        <!-- Buttons Options -->
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <div class="card h-100 p-3">
                    <h6 class="fw-bold">Basic Checks</h6>
                    <div class="form-check">
                        <input class="form-check-input check-mode" type="radio" name="scanMode" id="modeGeneral" value="general" checked>
                        <label class="form-check-label" for="modeGeneral">General Overview</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input check-mode" type="radio" name="scanMode" id="modeRep" value="reputation_dim">
                        <label class="form-check-label" for="modeRep">Reputation Dimensions</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input check-mode" type="radio" name="scanMode" id="modeContext" value="domain_context">
                        <label class="form-check-label" for="modeContext">Domain Context</label>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card h-100 p-3">
                    <h6 class="fw-bold">Reputation Insights</h6>
                    <div class="form-check">
                        <input class="form-check-input check-mode" type="radio" name="scanMode" id="modeBlacklist" value="blacklist">
                        <label class="form-check-label" for="modeBlacklist">Blacklist Listing</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input check-mode" type="radio" name="scanMode" id="modeSenders" value="domain_senders">
                        <label class="form-check-label" for="modeSenders">Domain Senders</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input check-mode" type="radio" name="scanMode" id="modeARecord" value="a_record">
                        <label class="form-check-label" for="modeARecord">A Record Reputation</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="text-end mb-4">
            <button class="btn btn-primary px-4" id="btnAnalyze" onclick="analyzeDomains()">
                <i class="bi bi-search"></i> Analyze Domains
            </button>
        </div>

        <!-- Dynamic Results Table -->
        <div class="card">
            <div class="card-header card-header-blue" id="tableTitle">Domain - General</div>
            <div class="card-body">
                <div class="table-responsive" id="tableContainer">
                    <!-- الجدول كيتبدل ديناميكياً هنا -->
                    <table id="resultsTable" class="table table-bordered table-striped w-100">
                        <thead></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script>
        let dataTable = null;

        async function analyzeDomains() {
            const domains = document.getElementById('domainInput').value;
            if(!domains.trim()) return alert("عافاك دخل شي دومين أولا!");

            // كنعرفو أشنو ختار المستخدم
            const selectedMode = document.querySelector('input[name="scanMode"]:checked').value;

            const btn = document.getElementById('btnAnalyze');
            btn.innerHTML = `<span class="spinner-border spinner-border-sm"></span> Analyzing...`;
            btn.disabled = true;

            try {
                const response = await fetch('/scan', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ domains: domains, mode: selectedMode })
                });
                const res = await response.json();

                renderTable(res.mode, res.data);

            } catch (err) {
                alert("وقع خطأ فالفحص");
            } finally {
                btn.innerHTML = `<i class="bi bi-search"></i> Analyze Domains`;
                btn.disabled = false;
            }
        }

        function renderTable(mode, data) {
            // إلا كان جدول قديم كنمحيوه باش نعاودو نبنيوه بأعمدة جداد
            if (dataTable) {
                dataTable.destroy();
                $('#resultsTable').empty();
            }

            let title = "Domain - General";
            let columns = [];
            let rows = [];

            if (mode === 'a_record') {
                title = "Domain - A Record Reputation";
                columns = [
                    { title: "Domain" },
                    { title: "Resolved IP (A Record)" },
                    { title: "Reverse DNS (PTR)" },
                    { title: "Status" },
                    { title: "Threat Score" }
                ];
                rows = data.map(i => [
                    i.domain,
                    `<code>${i.ip}</code>`,
                    i.ptr,
                    i.status === 'Active' ? '<span class="badge bg-success">Active</span>' : '<span class="badge bg-danger">Inactive</span>',
                    i.score
                ]);
            } else if (mode === 'blacklist') {
                title = "Domain - Blacklist Listing";
                columns = [
                    { title: "Domain" },
                    { title: "Spamhaus" },
                    { title: "SURBL" },
                    { title: "Abuse Score" },
                    { title: "Listing Status" }
                ];
                rows = data.map(i => [
                    i.domain,
                    `<span class="badge bg-success">${i.spamhaus}</span>`,
                    `<span class="badge bg-success">${i.surbl}</span>`,
                    i.abuse_score,
                    `<span class="badge bg-success">${i.status}</span>`
                ]);
            } else {
                // الوضع العادي: General Overview
                title = "Domain - General";
                columns = [
                    { title: "Domain" },
                    { title: "Last Seen" },
                    { title: "Tags" },
                    { title: "Abused" },
                    { title: "Whois" },
                    { title: "Score" },
                    { title: "Clusters" }
                ];
                rows = data.map(i => [
                    i.domain,
                    i.last_seen,
                    `<span class="badge bg-secondary">${i.tags}</span>`,
                    i.abused ? '<span class="badge bg-danger">True</span>' : '<span class="badge bg-success">False</span>',
                    `<ul class="mb-0 ps-3 small">
                        <li><b>created:</b> ${i.whois.created}</li>
                        <li><b>expires:</b> ${i.whois.expires}</li>
                        <li><b>registrar:</b> ${i.whois.registrar}</li>
                    </ul>`,
                    i.score,
                    `<code>${i.clusters}</code>`
                ]);
            }

            // تبديل عنوان الكارد
            document.getElementById('tableTitle').innerText = title;

            // بناء الجدول بـ DataTables
            dataTable = $('#resultsTable').DataTable({
                data: rows,
                columns: columns
            });
        }
    </script>
</body>
</html>
