<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain Intelligence Scanner</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- DataTables + Buttons for CSV -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css">

    <style>
        body { background-color: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .header-title { color: #007bff; font-weight: 500; font-size: 1.45rem; display: flex; align-items: center; gap: 8px; }
        .card-header-blue { background-color: #007bff; color: #fff; font-weight: 500; padding: 0.6rem 1rem; border-radius: 4px 4px 0 0; }
        .table-custom th { background-color: #f8f9fa; font-weight: 600; font-size: 0.85rem; border-bottom: 2px solid #dee2e6; }
        .table-custom td { font-size: 0.85rem; vertical-align: middle; }
        .sub-list { list-style-type: disc; padding-left: 1.2rem; margin-bottom: 0; }
        .hash-auth { font-family: monospace; font-size: 0.82rem; word-break: break-all; }
        .btn-export { background-color: #f8f9fa; border: 1px solid #ced4da; color: #333; font-size: 0.8rem; padding: 4px 10px; }
        .btn-export:hover { background-color: #e2e6ea; }
    </style>
</head>
<body class="p-3">
    <div class="container-fluid">
        <!-- Title & Description -->
        <div class="mb-3">
            <div class="header-title">
                <i class="bi bi-globe"></i> Domain Intelligence Scanner
            </div>
            <div class="text-muted small">Enter domains below to analyze their reputation, listing status, and behavior across various datasets.</div>
        </div>

        <!-- Input Box -->
        <div class="card mb-3 shadow-sm border">
            <div class="card-header bg-light py-2">
                <i class="bi bi-table"></i> <strong>Domain Input</strong>
            </div>
            <div class="card-body p-2">
                <textarea id="domainInput" class="form-control" rows="3" placeholder="awsglobalaccelerator.com&#10;lotterysambadresult.in">awsglobalaccelerator.com</textarea>
            </div>
        </div>

        <!-- All SIA Radio Buttons -->
        <div class="row g-3 mb-3">
            <!-- Basic Checks -->
            <div class="col-md-6">
                <div class="card h-100 p-3 shadow-sm border">
                    <h6 class="fw-bold mb-2">Basic Checks</h6>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="scanType" id="btnGeneral" value="general" checked>
                        <label class="form-check-label" for="btnGeneral">General Overview</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="scanType" id="btnRepDim" value="reputation_dim">
                        <label class="form-check-label" for="btnRepDim">Reputation Dimensions</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="scanType" id="btnContext" value="domain_context">
                        <label class="form-check-label" for="btnContext">Domain Context</label>
                    </div>
                </div>
            </div>

            <!-- Reputation Insights -->
            <div class="col-md-6">
                <div class="card h-100 p-3 shadow-sm border">
                    <h6 class="fw-bold mb-2">Reputation Insights</h6>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="scanType" id="btnBlacklist" value="blacklist">
                        <label class="form-check-label" for="btnBlacklist">Blacklist Listing</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="scanType" id="btnSenders" value="domain_senders">
                        <label class="form-check-label" for="btnSenders">Domain Senders</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="scanType" id="btnARecord" value="a_record">
                        <label class="form-check-label" for="btnARecord">A Record Reputation</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="scanType" id="btnNSRep" value="ns_rep">
                        <label class="form-check-label" for="btnNSRep">Nameserver Reputation</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="scanType" id="btnHostnames" value="hostnames">
                        <label class="form-check-label" for="btnHostnames">Hostnames Listed</label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Analyze Button -->
        <div class="text-end mb-4">
            <button class="btn btn-primary px-4 shadow-sm" id="btnAnalyze" onclick="runAnalysis()">
                <i class="bi bi-search"></i> Analyze Domains
            </button>
        </div>

        <!-- Dynamic Output Table -->
        <div class="card shadow-sm border">
            <div class="card-header-blue" id="tableHeaderLabel">Domain - General</div>
            <div class="card-body p-3">
                <div class="table-responsive">
                    <table id="resultsTable" class="table table-bordered table-custom w-100">
                        <thead></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>

    <script>
        let dtInstance = null;

        const MODES_CONFIG = {
            general: {
                title: "Domain - General",
                columns: [
                    { title: "Domain", data: "domain" },
                    { title: "Last Seen", data: "last_seen" },
                    { 
                        title: "Tags", 
                        data: "tags", 
                        render: d => `<code>${JSON.stringify(d)}</code>` 
                    },
                    { 
                        title: "Abused", 
                        data: "abused", 
                        render: d => d ? '<span class="text-danger fw-bold">true</span>' : '<span class="text-secondary">false</span>' 
                    },
                    { 
                        title: "Whois", 
                        data: "whois", 
                        render: w => `<ul class="sub-list">
                            <li><b>created:</b> ${w.created || 'N/A'}</li>
                            <li><b>expires:</b> ${w.expires || 'N/A'}</li>
                            <li><b>registrar:</b> ${w.registrar || 'N/A'}</li>
                        </ul>` 
                    },
                    { title: "Score", data: "score" },
                    { 
                        title: "Clusters", 
                        data: "clusters", 
                        render: c => `<ul class="sub-list"><li><b>auth:</b> <span class="hash-auth">${c}</span></li></ul>` 
                    }
                ]
            },
            reputation_dim: {
                title: "Domain - Reputation Dimensions",
                columns: [
                    { title: "Domain", data: "domain" },
                    { title: "SIA Score", data: "score" },
                    { title: "Email Threat", data: "email_threat" },
                    { title: "Web Threat", data: "web_threat" },
                    { title: "Phishing", data: "phishing" },
                    { title: "Malware", data: "malware" }
                ]
            },
            domain_context: {
                title: "Domain - Domain Context",
                columns: [
                    { title: "Domain", data: "domain" },
                    { title: "Registrar", data: "registrar" },
                    { title: "Nameservers", data: "nameservers" },
                    { title: "Resolved IPs", data: "ips" },
                    { title: "ASN", data: "asn" }
                ]
            },
            blacklist: {
                title: "Domain - Blacklist Listing",
                columns: [
                    { title: "Domain", data: "domain" },
                    { title: "DBL Listed", data: "dbl", render: d => d === 'Yes' ? '<span class="badge bg-danger">Listed</span>' : '<span class="badge bg-success">Clean</span>' },
                    { title: "ZBL Listed", data: "zbl", render: d => d === 'Yes' ? '<span class="badge bg-danger">Listed</span>' : '<span class="badge bg-success">Clean</span>' },
                    { title: "Detection Type", data: "detection" },
                    { title: "Return Code", data: "code" }
                ]
            },
            domain_senders: {
                title: "Domain - Domain Senders",
                columns: [
                    { title: "Domain", data: "domain" },
                    { title: "MX Record", data: "mx" },
                    { title: "Sender Score", data: "score" },
                    { title: "SPF Check", data: "spf" },
                    { title: "DKIM Check", data: "dkim" }
                ]
            },
            a_record: {
                title: "Domain - A Record Reputation",
                columns: [
                    { title: "Domain", data: "domain" },
                    { title: "A Record (IP)", data: "ip" },
                    { title: "PTR (Reverse DNS)", data: "ptr" },
                    { title: "IP Reputation", data: "ip_rep" },
                    { title: "Status", data: "status" }
                ]
            },
            ns_rep: {
                title: "Domain - Nameserver Reputation",
                columns: [
                    { title: "Domain", data: "domain" },
                    { title: "Primary NS", data: "primary_ns" },
                    { title: "NS IP", data: "ns_ip" },
                    { title: "NS Score", data: "ns_score" },
                    { title: "Status", data: "status" }
                ]
            },
            hostnames: {
                title: "Domain - Hostnames Listed",
                columns: [
                    { title: "Domain", data: "domain" },
                    { title: "Hostname", data: "hostname" },
                    { title: "Record Type", data: "type" },
                    { title: "Status", data: "status" }
                ]
            }
        };

        async function runAnalysis() {
            const inputVal = document.getElementById('domainInput').value.trim();
            if (!inputVal) return alert("المرجو إدخال دومين واحد على الأقل.");

            const selectedMode = document.querySelector('input[name="scanType"]:checked').value;
            const config = MODES_CONFIG[selectedMode];

            const btn = document.getElementById('btnAnalyze');
            btn.innerHTML = `<span class="spinner-border spinner-border-sm"></span> Analyzing...`;
            btn.disabled = true;

            try {
                const response = await fetch('/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ domains: inputVal, mode: selectedMode })
                });
                const res = await response.json();

                // تحديث العنوان
                document.getElementById('tableHeaderLabel').innerText = config.title;

                // إعادة بناء الجدول
                if (dtInstance) {
                    dtInstance.destroy();
                    $('#resultsTable').empty();
                }

                dtInstance = $('#resultsTable').DataTable({
                    data: res.data,
                    columns: config.columns,
                    dom: '<"d-flex justify-content-between align-items-center mb-2"<"btn-group"B>f>rtip',
                    buttons: [
                        {
                            extend: 'csvHtml5',
                            text: 'Export CSV',
                            className: 'btn btn-export'
                        }
                    ],
                    language: {
                        search: "Search: "
                    }
                });

            } catch (err) {
                alert("وقع خطأ فـ الاتصال بالخادم.");
            } finally {
                btn.innerHTML = `<i class="bi bi-search"></i> Analyze Domains`;
                btn.disabled = false;
            }
        }

        // تشغيل أولي عند فتح الصفحة
        $(document).ready(() => {
            runAnalysis();
        });
    </script>
</body>
</html>
