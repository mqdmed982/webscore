<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Domain Intelligence Scanner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .header-title { color: #007bff; font-weight: bold; }
        .card-header-blue { background-color: #007bff; color: white; font-weight: 500; }
    </style>
</head>
<body class="p-4">
    <div class="container-fluid">
        <!-- Header -->
        <div class="mb-4">
            <h3 class="header-title"><i class="bi bi-globe"></i> Domain Intelligence Scanner</h3>
            <p class="text-muted">Enter domains below to analyze their reputation, listing status, and behavior across various datasets.</p>
        </div>

        <!-- Input Box -->
        <div class="card mb-3">
            <div class="card-header bg-light"><strong><i class="bi bi-table"></i> Domain Input</strong></div>
            <div class="card-body">
                <textarea id="domainInput" class="form-control" rows="4" placeholder="lotterysambadresult.in&#10;example.com"></textarea>
            </div>
        </div>

        <!-- Check Options -->
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <div class="card h-100 p-3">
                    <h6 class="fw-bold">Basic Checks</h6>
                    <div class="form-check"><input class="form-check-input" type="radio" name="checkType" checked> <label class="form-check-label">General Overview</label></div>
                    <div class="form-check"><input class="form-check-input" type="radio" name="checkType"> <label class="form-check-label">Reputation Dimensions</label></div>
                    <div class="form-check"><input class="form-check-input" type="radio" name="checkType"> <label class="form-check-label">Domain Context</label></div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card h-100 p-3">
                    <h6 class="fw-bold">Reputation Insights</h6>
                    <div class="form-check"><input class="form-check-input" type="radio" name="repType"> <label class="form-check-label">Blacklist Listing</label></div>
                    <div class="form-check"><input class="form-check-input" type="radio" name="repType"> <label class="form-check-label">Domain Senders</label></div>
                    <div class="form-check"><input class="form-check-input" type="radio" name="repType"> <label class="form-check-label">A Record Reputation</label></div>
                </div>
            </div>
        </div>

        <div class="text-end mb-4">
            <button class="btn btn-primary px-4" id="btnAnalyze" onclick="analyzeDomains()">
                <i class="bi bi-search"></i> Analyze Domains
            </button>
        </div>

        <!-- Results Table -->
        <div class="card">
            <div class="card-header card-header-blue">Domain - General</div>
            <div class="card-body">
                <div class="table-responsive">
                    <table id="resultsTable" class="table table-bordered table-striped w-100">
                        <thead>
                            <tr>
                                <th>Domain</th>
                                <th>Last Seen</th>
                                <th>Tags</th>
                                <th>Abused</th>
                                <th>Whois</th>
                                <th>Score</th>
                                <th>Clusters / Auth</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script>
        let table = $('#resultsTable').DataTable();

        async function analyzeDomains() {
            const domains = document.getElementById('domainInput').value;
            if(!domains.trim()) return alert("عافاك دخل شي دومين أولا!");

            const btn = document.getElementById('btnAnalyze');
            btn.innerHTML = `<span class="spinner-border spinner-border-sm"></span> جاري الفحص...`;
            btn.disabled = true;

            try {
                const response = await fetch('/scan', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ domains: domains })
                });
                const data = await response.json();

                table.clear();
                data.forEach(item => {
                    const whoisHtml = `
                        <ul class="mb-0 ps-3 small">
                            <li><b>created:</b> ${item.whois.created}</li>
                            <li><b>expires:</b> ${item.whois.expires}</li>
                            <li><b>registrar:</b> ${item.whois.registrar}</li>
                        </ul>
                    `;
                    table.row.add([
                        item.domain,
                        item.last_seen,
                        `<span class="badge bg-secondary">${item.tags}</span>`,
                        item.abused ? '<span class="badge bg-danger">True</span>' : '<span class="badge bg-success">False</span>',
                        whoisHtml,
                        item.score,
                        `<code>${item.cluster_auth}</code>`
                    ]);
                });
                table.draw();
            } catch (err) {
                alert("وقع خطأ فالفحص");
            } finally {
                btn.innerHTML = `<i class="bi bi-search"></i> Analyze Domains`;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
